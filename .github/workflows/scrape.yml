name: Daily Scrape

on:
  schedule:
    - cron: "0 4 * * *" # 04:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-scrape
  cancel-in-progress: false

env:
  UV_TORCH_BACKEND: cpu # uv selects CPU-only torch wheels

jobs:
  scrape:
    name: Scrape and export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Cache CLIP model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-clip-vit-base-patch32

      - name: Scrape recent consumer-category alerts
        run: |
          for c in TOYS ELECTRICAL_APPLIANCES COSMETICS PROTECTIVE_EQUIPMENT \
                   CHILDCARE_ARTICLES HOBBY_SPORTS_EQUIPMENT CLOTHING_TEXTILES \
                   JEWELLERY CHEMICAL_PRODUCTS LIGHTING_EQUIPMENT LIGHTING_CHAINS \
                   FURNITURE DECORATIVE_ARTICLES GADGETS KITCHEN_COOKING_ACCESSORIES \
                   HAND_TOOLS LASER_POINTERS PYROTECHNIC_ARTICLES GAS_APPLIANCES OTHER; do
            echo "::group::scrape $c"
            uv run --no-project --python 3.12 \
              --with httpx --with alembic --with sqlalchemy \
              python scraper/ingest.py --category "$c" --no-images --max-pages 1
            echo "::endgroup::"
          done

      - name: Export new per-ID alert files
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }} # optional; raises HuggingFace rate limits
        run: |
          ok=0
          for attempt in 1 2 3; do
            if uv run --no-project --python 3.12 \
              --with torch --with transformers --with pillow \
              python scripts/export_alerts.py; then ok=1; break; fi
            echo "export attempt $attempt failed, retrying in 30s…"
            sleep 30
          done
          [ "$ok" = 1 ]

      - name: Commit new alerts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain docs/data/alerts)" ]; then
            n=$(git status --porcelain docs/data/alerts | wc -l)
            git add docs/data/alerts
            git commit -m "chore: daily scrape — $n new/updated alert(s)"
            git push
          else
            echo "No new alerts."
          fi
