name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/bundle_data.py"
      - ".github/workflows/deploy-pages.yml"
  workflow_run:
    # GITHUB_TOKEN-pushed commits don't trigger `push`, so deploy after the scrape completes
    workflows: ["Daily Scrape"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build data bundles from per-ID alert files
        run: python scripts/bundle_data.py

      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
