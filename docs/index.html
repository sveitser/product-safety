<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search — Product Safety</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f0f2f5; color: #222; min-height: 100vh; }

    header { background: #1a1a2e; color: #fff; padding: 14px 20px; display: flex; align-items: center; gap: 20px; }
    header h1 { font-size: 1.1rem; font-weight: 600; }
    nav a { color: #aab; text-decoration: none; font-size: 0.9rem; margin-left: 14px; }
    nav a:hover, nav a.active { color: #fff; }

    main { max-width: 1100px; margin: 24px auto; padding: 0 16px; }

    .search-bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .search-bar input[type="text"] {
      flex: 1; min-width: 220px; padding: 10px 14px; font-size: 1rem;
      border: 1px solid #ccc; border-radius: 8px;
    }
    .search-bar select {
      padding: 10px; font-size: 0.95rem; border: 1px solid #ccc; border-radius: 8px; background: #fff;
    }

    .results-meta { font-size: 0.85rem; color: #777; margin-bottom: 12px; }

    .alert-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px;
    }
    .alert-card {
      background: #fff; border-radius: 10px; overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,.1); transition: box-shadow .15s;
      text-decoration: none; color: inherit; display: block;
    }
    .alert-card:hover { box-shadow: 0 4px 12px rgba(0,0,0,.18); }
    .alert-card img { width: 100%; height: 170px; object-fit: contain; background: #f8f8f8; display: block; }
    .no-img { width: 100%; height: 170px; background: #eee; display: flex; align-items: center; justify-content: center; color: #aaa; font-size: 0.85rem; }
    .card-body { padding: 11px; }
    .ref { font-size: 0.72rem; color: #888; margin-bottom: 3px; }
    .product-name { font-size: 0.9rem; font-weight: 600; line-height: 1.3; }
    .brands { font-size: 0.8rem; color: #555; margin-top: 2px; }
    .category-badge {
      display: inline-block; background: #e3f2fd; color: #1565c0;
      border-radius: 3px; padding: 1px 7px; font-size: 0.68rem; margin-top: 7px;
    }
    .risk-list { font-size: 0.75rem; color: #b71c1c; margin-top: 6px; }
    .country { font-size: 0.72rem; color: #888; margin-top: 5px; }

    .pagination { display: flex; gap: 6px; justify-content: center; align-items: center; margin: 24px 0; flex-wrap: wrap; }
    .pagination button {
      border: 1px solid #ccc; background: #fff; border-radius: 6px; padding: 6px 12px;
      cursor: pointer; font-size: 0.85rem;
    }
    .pagination button:disabled { opacity: .4; cursor: default; }
    .pagination .current { font-weight: 600; padding: 6px 10px; }

    .empty { color: #888; grid-column: 1 / -1; padding: 40px; text-align: center; }

    .notice {
      background: #eef2ff; border: 1px solid #dde3f5; border-radius: 8px;
      padding: 10px 14px; margin-bottom: 16px; font-size: 0.8rem; color: #555; line-height: 1.5;
    }
    .notice a { color: #1565c0; }
  </style>
</head>
<body>
  <header>
    <h1>Product Safety</h1>
    <nav>
      <a href="index.html" class="active">Search</a>
      <a href="photo.html">Photo Search</a>
    </nav>
  </header>

  <main>
    <div class="notice">
      Data: <a href="https://ec.europa.eu/safety-gate-alerts/screen/search" target="_blank" rel="noopener">Safety Gate alerts</a>,
      © European Union, 1995–2026, licensed under
      <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>.
      Unofficial mirror — data has been reformatted and re-indexed, and may not include all alerts.
    </div>
    <div class="search-bar">
      <input type="text" id="q" placeholder="Search products, brands, risks…" autocomplete="off">
      <select id="category"><option value="">All categories</option></select>
    </div>
    <div class="results-meta" id="meta">Loading…</div>
    <div class="alert-grid" id="results"></div>
    <div class="pagination" id="pagination"></div>
  </main>

  <script type="module">
    import MiniSearch from 'https://cdn.jsdelivr.net/npm/minisearch@7.1.0/+esm';

    const EU_IMAGE_BASE = 'https://ec.europa.eu/safety-gate-alerts/public/api/notification/image';
    const PAGE_SIZE = 20;
    const SEARCH_FIELDS = [
      'reference', 'product_name', 'product_name_specific', 'brands',
      'model_types', 'risk_description', 'country', 'country_of_origin',
    ];

    const qInput = document.getElementById('q');
    const catSelect = document.getElementById('category');
    const metaEl = document.getElementById('meta');
    const resultsEl = document.getElementById('results');
    const pagEl = document.getElementById('pagination');

    let byId = new Map();    // id -> alert
    let allByDate = [];      // all alerts, date desc
    let ms = null;
    let state = { q: '', category: '', page: 1 };

    init();

    async function init() {
      const res = await fetch('data/alerts-bundle.json');
      if (!res.ok) {
        metaEl.textContent = 'Error: data/alerts-bundle.json not found. Run `just bundle-data`.';
        return;
      }
      const bundle = await res.json();
      allByDate = bundle.items;
      for (const a of allByDate) byId.set(a.id, a);

      for (const c of bundle.categories) {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = titleCase(c);
        catSelect.appendChild(opt);
      }

      ms = new MiniSearch({
        idField: 'id',
        fields: SEARCH_FIELDS,
        extractField: (doc, field) => {
          const v = doc[field];
          return Array.isArray(v) ? v.join(' ') : (v ?? '');
        },
        searchOptions: {
          prefix: true,
          fuzzy: 0.2,
          boost: { product_name: 3, brands: 2, product_name_specific: 2 },
        },
      });
      ms.addAll(allByDate);

      readUrl();
      qInput.addEventListener('input', () => { state.q = qInput.value; state.page = 1; run(); });
      catSelect.addEventListener('change', () => { state.category = catSelect.value; state.page = 1; run(); });
      window.addEventListener('popstate', () => { readUrl(); run(false); });
      run(false);
    }

    function readUrl() {
      const p = new URLSearchParams(location.search);
      state.q = p.get('q') || '';
      state.category = p.get('category') || '';
      state.page = Math.max(1, parseInt(p.get('page') || '1', 10));
      qInput.value = state.q;
      catSelect.value = state.category;
    }

    function writeUrl() {
      const p = new URLSearchParams();
      if (state.q) p.set('q', state.q);
      if (state.category) p.set('category', state.category);
      if (state.page > 1) p.set('page', state.page);
      const qs = p.toString();
      history.replaceState(null, '', qs ? `?${qs}` : location.pathname);
    }

    function currentResults() {
      let items;
      if (state.q.trim()) {
        items = ms.search(state.q).map(r => byId.get(r.id));
      } else {
        items = allByDate; // already date desc
      }
      if (state.category) items = items.filter(a => a.product_category === state.category);
      return items;
    }

    function run(updateUrl = true) {
      if (updateUrl) writeUrl();
      const items = currentResults();
      const total = items.length;
      const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
      if (state.page > totalPages) state.page = totalPages;
      const start = (state.page - 1) * PAGE_SIZE;
      const pageItems = items.slice(start, start + PAGE_SIZE);

      metaEl.textContent = `${total} alert${total === 1 ? '' : 's'} found`;
      renderCards(pageItems);
      renderPagination(totalPages);
    }

    function mainPhotoUrl(a) {
      if (!a.photos || !a.photos.length) return null;
      const main = a.photos.find(p => p.main) || a.photos[0];
      return `${EU_IMAGE_BASE}/${main.photo_id}`;
    }

    function renderCards(items) {
      if (!items.length) {
        resultsEl.innerHTML = '<p class="empty">No alerts found.</p>';
        return;
      }
      resultsEl.innerHTML = items.map(a => {
        const img = mainPhotoUrl(a);
        const name = a.product_name || a.product_name_specific || '(unnamed)';
        const date = (a.publication_date || '').slice(0, 10);
        const specific = (a.product_name_specific && a.product_name_specific !== a.product_name)
          ? `<div class="brands">${escHtml(a.product_name_specific)}</div>` : '';
        const brands = (a.brands && a.brands.length)
          ? `<div class="brands">${escHtml(a.brands.join(', '))}</div>` : '';
        const risks = (a.risk_types && a.risk_types.length)
          ? `<div class="risk-list">⚠ ${escHtml(a.risk_types.map(titleCase).join(' · '))}</div>` : '';
        const origin = a.country_of_origin ? ` · Origin: ${escHtml(a.country_of_origin)}` : '';
        const imgHtml = img
          ? `<img src="${img}" alt="${escHtml(name)}" loading="lazy" onerror="this.outerHTML='<div class=\\'no-img\\'>No image</div>'">`
          : '<div class="no-img">No image</div>';
        return `
          <a class="alert-card" href="detail.html?id=${a.id}">
            ${imgHtml}
            <div class="card-body">
              <div class="ref">${escHtml(a.reference)} · ${escHtml(date)}</div>
              <div class="product-name">${escHtml(name)}</div>
              ${specific}
              ${brands}
              <span class="category-badge">${escHtml(titleCase(a.product_category))}</span>
              ${risks}
              <div class="country">${escHtml(a.country || '')}${origin}</div>
            </div>
          </a>`;
      }).join('');
    }

    function renderPagination(totalPages) {
      if (totalPages <= 1) { pagEl.innerHTML = ''; return; }
      const p = state.page;
      const go = n => { state.page = n; run(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
      pagEl.innerHTML = '';

      const prev = button('‹ Prev', () => go(p - 1)); prev.disabled = p <= 1; pagEl.appendChild(prev);
      const lo = Math.max(1, p - 2), hi = Math.min(totalPages, p + 2);
      for (let n = lo; n <= hi; n++) {
        if (n === p) {
          const span = document.createElement('span'); span.className = 'current'; span.textContent = n;
          pagEl.appendChild(span);
        } else {
          pagEl.appendChild(button(String(n), () => go(n)));
        }
      }
      const next = button('Next ›', () => go(p + 1)); next.disabled = p >= totalPages; pagEl.appendChild(next);
    }

    function button(label, onClick) {
      const b = document.createElement('button');
      b.textContent = label;
      b.addEventListener('click', onClick);
      return b;
    }

    function titleCase(s) {
      return String(s || '').replace(/_/g, ' ').toLowerCase()
        .replace(/\b\w/g, c => c.toUpperCase());
    }

    function escHtml(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
  </script>
</body>
</html>
