[project]
name = "product-safety"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["backend", "scraper"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 98
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
# scripts/ carry heavy optional deps (torch, pillow, httpx) and aren't type
# checked; test_make_thumbs imports from scripts via sys.path, so exclude it too.
exclude = ["scripts", "tests/test_make_thumbs.py"]
